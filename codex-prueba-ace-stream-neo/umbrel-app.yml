manifestVersion: 1
id: codex-prueba-ace-stream-neo
category: media
icon: "https://raw.githubusercontent.com/Ismaeloul/codex-prueba/main/codex-prueba-ace-stream-neo/icon.svg"
name: Ace Stream Neo V3 - Codex Prueba
version: "0.8.7"
tagline: Prueba aislada del reproductor AceStream y de Xtream Codes
description: >-
  Tienda de prueba independiente para validar Ace Stream Neo V3 en Umbrel.
  Incluye recuperación del reproductor, reproducción AceStream por hash,
  Xtream Codes para televisión, películas y series. El apartado Pelis y Series
  permite buscar por título y filtrar por tipo, categoría e idioma, abrir los
  episodios de cada serie y reproducir formatos habituales desde el servidor local.
  Usa una app ID, datos y contenedores separados del reproductor original.
releaseNotes: >-
  Versión 0.8.7: Pelis y Series pregunta qué idiomas incluir y carga solo las
  categorías elegidas; separa Español (España) de Español latinoamericano y permite
  editar la selección. Añade portadas, fichas Xtream con sinopsis, género, año,
  valoración y reparto cuando el proveedor los facilita, además de logos de canales.
  Las imágenes pasan por el servidor local y tienen fallback genérico. Conserva la
  corrección de nginx y el aislamiento de la tienda de pruebas de 0.8.6.
